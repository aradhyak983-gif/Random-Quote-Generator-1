<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Generator-1</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      background-color: rgb(244, 241, 241);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: rgb(209, 239, 249);
      width: 100%;
      max-width: 600px;

      padding: 30px;
      border-radius: 15px;

      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #334155;
      margin-bottom: 10px;
      font-size: 25px;
    }

    .quote-box {
      padding: 10px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    #author {
      padding: 30px;
      color: #0d9488;
      font-size: 16px;
      font-size: 20px;
    }

    button {
      background-color: #6998ff;
      color: white;

      border: none;
      padding: 15px 30px;

      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;

      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #4c5fd5;
    }
  </style>
  <body>
    <div class="container">
      <div class="quote-box">
        <h1 id="quote">Random Quote</h1>
      </div>

      <div>
        <p id="author">-Author</p>
      </div>

      <button onclick="generateQuote()">New Quote</button>
    </div>

    <script>
      function generateQuote() {
        fetch("https://quoteslate.vercel.app/api/quotes/random")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("quote").innerText = data.quote;
            document.getElementById("author").innerText = data.author;
          });
      }
    </script>
  </body>
</html>
